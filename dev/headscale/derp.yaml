# Placeholder DERP map for the throwaway Headscale.
#
# Headscale refuses to start with an empty DERPMap ("initial DERPMap is empty,
# Headscale requires at least one entry"), but the dev instance has no real
# Tailscale clients — nodes are created with `headscale debug create-node`. So
# this points at TEST-NET-2 (198.51.100.0/24, RFC 5737), which is
# unroutable by design. It satisfies the startup check and never sends traffic
# anywhere, which is the point: no calls out to controlplane.tailscale.com.
regions:
  900:
    regionid: 900
    regioncode: devnull
    regionname: Headboard dev placeholder
    nodes:
      - name: 900a
        regionid: 900
        hostname: derp.invalid
        ipv4: 198.51.100.1
        stunport: 0
        stunonly: false
        derpport: 0

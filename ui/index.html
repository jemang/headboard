<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Rewritten by the Go server to the path Headboard is served under, so the
      build's relative URLs resolve the same from /manage as from
      /manage/devices/12. Left as "/" for a site root; internal/web fails to
      start if this tag goes missing.
    -->
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1a24" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0e1a24" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Headboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
